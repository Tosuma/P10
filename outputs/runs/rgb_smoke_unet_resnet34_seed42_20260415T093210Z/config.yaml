experiment_name: rgb_smoke_unet_resnet34
modality: rgb
in_channels: 3
model:
  architecture: Unet
  encoder_name: resnet34
  encoder_weights: imagenet
  classes: 1
seed: 42
device: null
paths:
  run_root: outputs/runs
  train_manifest: data/splits/smoke_train.csv
  val_manifest: data/splits/smoke_val.csv
  test_manifest: data/splits/smoke_test.csv
  patch_manifest_dir: data/patches/smoke_rgb
  train_patch_manifest: data/patches/smoke_rgb/train_patches.csv
  val_patch_manifest: data/patches/smoke_rgb/val_patches.csv
  test_patch_manifest: data/patches/smoke_rgb/test_patches.csv
  normalization_stats: data/processed/smoke_rgb_normalization.json
patch:
  mode: fixed_grid
  size:
  - 640
  - 480
  patches_per_image: 4
  keep_empty_probability: 0.25
augmentations:
  brightness: 0.05
  contrast: 0.05
  noise_std: 0.0
loss:
  bce_weight: 0.5
  dice_weight: 0.5
training:
  batch_size: 2
  num_workers: 0
  lr: 0.001
  weight_decay: 0.0001
  epochs: 1
  grad_clip: 1.0
  early_stopping_patience: 2
  freeze_encoder_epochs: 0
  scheduler:
    t_max: 1
    eta_min: 1.0e-06
evaluation:
  threshold: 0.5
  num_visualizations: 2
_config_path: C:\Users\tobia\Coding-Git\p10\tbd\masking\configs\smoke_rgb.yaml
